<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda v3</title>
  <link rel="stylesheet" href="style.css">

  <style>
    [hidden] { display: none !important; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== LATAR BELAKANG ===== */
    body {
      font-family: Arial, Helvetica, sans-serif !important;
      background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 50%, #f0f9ff 100%) fixed !important;
      color: #1e293b !important;
      padding: 24px !important;
      min-height: 100vh;
    }

    .bingkai {
      max-width: 1100px;
      min-height: 90vh;
      margin: 0 auto;
      background: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(30, 58, 138, .18);
    }

    /* ===== TOMBOL BERJAJAR HORIZONTAL ===== */
    #bar {
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-between !important;
      align-items: center !important;
      gap: 12px !important;
      flex-wrap: wrap !important;
      padding: 0 0 20px 0 !important;
      border-bottom: 3px solid #1e3a8a !important;
      margin-bottom: 24px !important;
    }
    #bar button {
      display: inline-block !important;
      width: auto !important;
      flex: 0 0 auto !important;
      background: #eff6ff !important;
      color: #1e3a8a !important;
      border: 2px solid #1e3a8a !important;
      border-radius: 8px !important;
      padding: 10px 28px !important;
      font-size: 16px !important;
      font-weight: bold !important;
      cursor: pointer;
      transition: all .2s;
    }
    #bar button:hover,
    #bar button.dipilih {
      background: #1e3a8a !important;
      color: #ffffff !important;
      box-shadow: 0 4px 10px rgba(30, 58, 138, .3);
    }
    /* tombol log out merah */
    #bar button.keluar {
      background: #fef2f2 !important;
      color: #b91c1c !important;
      border-color: #b91c1c !important;
    }
    #bar button.keluar:hover {
      background: #b91c1c !important;
      color: #ffffff !important;
    }

    /* ===== ISI ===== */
    h2 { margin-bottom: 14px !important; color: #1e3a8a !important; text-align: left !important; }
    p  { line-height: 1.6; color: #334155 !important; text-align: left !important; }

    #beranda {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      padding: 30px;
      border-radius: 12px;
    }
    #beranda h2, #beranda p { color: #ffffff !important; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }
    th, td { border: 1px solid #cbd5e1; padding: 12px; text-align: left; color: #1e293b; }
    th { background: #1e3a8a; color: #ffffff; border-color: #1e3a8a; }
    tbody tr:nth-child(even) { background: #f1f5f9; }
    tbody tr:hover { background: #dbeafe; }

    /* ===== FORMULIR ===== */
    .kotak-form {
      max-width: 480px;
      background: #f8fafc;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
    }
    .kotak-form label { display: block; margin: 14px 0 6px; font-weight: bold; color: #1e3a8a !important; }
    .kotak-form input, .kotak-form select {
      width: 100%; padding: 10px; border: 2px solid #93c5fd; border-radius: 8px;
      font-size: 15px; background: #fff;
    }
    .kotak-form input:focus, .kotak-form select:focus { outline: none; border-color: #1e3a8a; }
    .kotak-form button {
      margin-top: 20px; background: #1e3a8a; color: #fff; border: none;
      border-radius: 8px; padding: 12px 32px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .kotak-form button:hover { background: #2563eb; }

    /* ===== LOGIN ADMINISTRATOR (tambahan) ===== */
    #pesan-admin { margin-top: 14px; font-weight: bold; }
    #pesan-admin.salah { color: #b91c1c !important; }
    #pesan-admin.benar { color: #15803d !important; }
  </style>
</head>
<body>

  <div class="bingkai">

    <!-- ===== TOMBOL BERJAJAR HORIZONTAL ===== -->
    <div id="bar">
      <button data-id="data-siswa" onclick="tampil('data-siswa')">Data Siswa</button>
      <button data-id="data-nilai" onclick="tampil('data-nilai')">Data Nilai</button>
      <button data-id="formulir"   onclick="tampil('formulir')">Formulir</button>
      <button data-id="login-admin" onclick="tampil('login-admin')">Login Administrator</button>
      <button class="keluar"       onclick="keluar()">Log Out</button>
    </div>

    <!-- ===== ISI ===== -->
    <div class="isi">

      <section id="beranda" class="bagian">
        <h2>Beranda Wali Kelas</h2>
        <p>Selamat datang. Pilih menu di atas: <b>Data Siswa</b>, <b>Data Nilai</b>, atau <b>Formulir</b>.</p>
      </section>

      <section id="data-siswa" class="bagian" hidden>
        <h2>Data Siswa</h2>
        <table>
          <thead>
            <tr><th>No</th><th>NISN</th><th>Nama</th><th>Kelas</th><th>Jenis Kelamin</th></tr>
          </thead>
          <tbody id="isi-siswa"></tbody>
        </table>
      </section>

      <section id="data-nilai" class="bagian" hidden>
        <h2>Data Nilai</h2>
        <table>
          <thead>
            <tr><th>No</th><th>Nama</th><th>Matematika</th><th>B. Indonesia</th><th>B. Inggris</th><th>IPA</th><th>Rata-rata</th></tr>
          </thead>
          <tbody id="isi-nilai"></tbody>
        </table>
      </section>

      <section id="formulir" class="bagian" hidden>
        <h2>Formulir Pendaftaran</h2>
        <form id="form-daftar" class="kotak-form">
          <label>NISN</label>
          <input type="text" id="nisn" required>

          <label>Nama Lengkap</label>
          <input type="text" id="nama" required>

          <label>Kelas</label>
          <select id="kelas" required>
            <option value="">-- Pilih Kelas --</option>
            <option>X</option><option>XI</option><option>XII</option>
          </select>

          <label>Jenis Kelamin</label>
          <select id="jk" required>
            <option value="">-- Pilih --</option>
            <option>Laki-laki</option><option>Perempuan</option>
          </select>

          <button type="submit">Daftar</button>
        </form>
      </section>

      <!-- ===== LOGIN ADMINISTRATOR (tambahan) ===== -->
      <section id="login-admin" class="bagian" hidden>
        <h2>Login Administrator</h2>
        <form id="form-admin" class="kotak-form">
          <label>Username</label>
          <input type="text" id="admin-user" autocomplete="username" required>

          <label>Password</label>
          <input type="password" id="admin-pass" autocomplete="current-password" required>

          <button type="submit">Login</button>
          <p id="pesan-admin"></p>
        </form>
      </section>

    </div>
  </div>

  <script>
    // Harus login dulu
    if (sessionStorage.getItem("login") !== "walikelas") {
      window.location.href = "login-wali-kelas.html";
    }

    var siswa = [
      { nisn: "1001", nama: "Andi Pratama",   kelas: "X",   jk: "Laki-laki" },
      { nisn: "1002", nama: "Siti Aisyah",    kelas: "X",   jk: "Perempuan" },
      { nisn: "1003", nama: "Budi Santoso",   kelas: "XI",  jk: "Laki-laki" },
      { nisn: "1004", nama: "Dewi Lestari",   kelas: "XI",  jk: "Perempuan" },
      { nisn: "1005", nama: "Rizky Ramadhan", kelas: "XII", jk: "Laki-laki" }
    ];
    var nilai = [
      { nama: "Andi Pratama",   mtk: 85, bin: 80, big: 78, ipa: 82 },
      { nama: "Siti Aisyah",    mtk: 90, bin: 88, big: 92, ipa: 89 },
      { nama: "Budi Santoso",   mtk: 75, bin: 80, big: 70, ipa: 77 },
      { nama: "Dewi Lestari",   mtk: 88, bin: 85, big: 90, ipa: 86 },
      { nama: "Rizky Ramadhan", mtk: 80, bin: 78, big: 82, ipa: 79 }
    ];

    function ambilBaru() {
      try { return JSON.parse(localStorage.getItem("siswaBaru")) || []; }
      catch (e) { return []; }
    }

    function isiTabel() {
      var html = "";
      siswa.concat(ambilBaru()).forEach(function (s, i) {
        html += "<tr><td>" + (i + 1) + "</td><td>" + s.nisn + "</td><td>" + s.nama +
                "</td><td>" + s.kelas + "</td><td>" + s.jk + "</td></tr>";
      });
      document.getElementById("isi-siswa").innerHTML = html;

      var h2 = "";
      nilai.forEach(function (n, i) {
        var rata = ((n.mtk + n.bin + n.big + n.ipa) / 4).toFixed(1);
        h2 += "<tr><td>" + (i + 1) + "</td><td>" + n.nama + "</td><td>" + n.mtk +
              "</td><td>" + n.bin + "</td><td>" + n.big + "</td><td>" + n.ipa +
              "</td><td><b>" + rata + "</b></td></tr>";
      });
      document.getElementById("isi-nilai").innerHTML = h2;
    }

    // tampilkan SATU bagian saja, tombol yang dipilih berwarna biru tua
    function tampil(id) {
      document.querySelectorAll(".bagian").forEach(function (b) {
        b.hidden = (b.id !== id);
      });
      document.querySelectorAll("#bar button[data-id]").forEach(function (t) {
        t.classList.toggle("dipilih", t.getAttribute("data-id") === id);
      });
    }

    function keluar() {
      sessionStorage.removeItem("login");
      window.location.href = "login-wali-kelas.html";
    }

    document.getElementById("form-daftar").addEventListener("submit", function (e) {
      e.preventDefault();
      var baru = ambilBaru();
      baru.push({
        nisn: document.getElementById("nisn").value,
        nama: document.getElementById("nama").value,
        kelas: document.getElementById("kelas").value,
        jk: document.getElementById("jk").value
      });
      localStorage.setItem("siswaBaru", JSON.stringify(baru));
      alert("Pendaftaran berhasil! Data masuk ke menu Data Siswa.");
      this.reset();
      isiTabel();
      tampil("data-siswa");
    });

    // ===== LOGIN ADMINISTRATOR (tambahan) =====
    // Akun contoh: username "admin", password "admin123" (ganti sesuai kebutuhan)
    var ADMIN_USER = "admin";
    var ADMIN_PASS = "admin123";

    document.getElementById("form-admin").addEventListener("submit", function (e) {
      e.preventDefault();
      var pesan = document.getElementById("pesan-admin");
      var u = document.getElementById("admin-user").value;
      var p = document.getElementById("admin-pass").value;

      if (u === ADMIN_USER && p === ADMIN_PASS) {
        sessionStorage.setItem("loginAdmin", "ya");
        pesan.className = "benar";
        pesan.textContent = "Login administrator berhasil.";
        this.reset();
      } else {
        pesan.className = "salah";
        pesan.textContent = "Username atau password salah.";
      }
    });

    isiTabel();
    tampil("beranda");
  </script>
</body>
</html>
