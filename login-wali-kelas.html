<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Wali Kelas</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== LATAR BELAKANG ===== */
    body.halaman-login {
      font-family: Arial, Helvetica, sans-serif !important;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 55%, #93c5fd 100%) fixed !important;
      min-height: 100vh;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 24px !important;
    }

    /* ===== KOTAK LOGIN ===== */
    .kotak-login {
      width: 100%;
      max-width: 400px;
      background: #ffffff !important;
      border: none !important;
      border-radius: 16px !important;
      padding: 36px 32px !important;
      box-shadow: 0 15px 40px rgba(15, 23, 42, .35);
      text-align: center;
    }
    .kotak-login h1 {
      color: #1e3a8a !important;
      font-size: 32px;
      margin-bottom: 6px;
    }
    .kotak-login .sub {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* ===== FORM RAPI KE BAWAH ===== */
    #form-login {
      display: flex !important;
      flex-direction: column !important;
      gap: 14px !important;
      text-align: left;
    }
    #form-login input,
    #form-login select {
      display: block !important;
      width: 100% !important;
      padding: 12px 14px !important;
      font-size: 15px !important;
      color: #1e293b !important;
      background: #f8fafc !important;
      border: 2px solid #bfdbfe !important;
      border-radius: 10px !important;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    #form-login input:focus,
    #form-login select:focus {
      border-color: #1e3a8a !important;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .25);
      background: #ffffff !important;
    }

    /* ===== PESAN ERROR ===== */
    #pesan-error {
      color: #b91c1c !important;
      font-size: 14px;
      font-weight: bold;
      min-height: 18px;
      text-align: center;
    }

    /* ===== TOMBOL ===== */
    #form-login .tombol {
      display: block !important;
      width: 100% !important;
      padding: 13px !important;
      font-size: 16px !important;
      font-weight: bold !important;
      color: #ffffff !important;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6) !important;
      border: none !important;
      border-radius: 10px !important;
      cursor: pointer;
      transition: transform .15s, box-shadow .2s;
    }
    #form-login .tombol:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(30, 58, 138, .4);
    }

    /* ===== CATATAN ===== */
    .kotak-login .catatan {
      margin-top: 22px;
      padding: 10px;
      background: #eff6ff;
      border-radius: 8px;
      color: #334155 !important;
      font-size: 14px;
      text-align: center !important;
    }
  </style>
</head>
<body class="halaman-login">

  <div class="kotak-login">
    <h1>Login</h1>
    <p class="sub">Silakan masuk untuk melanjutkan</p>

    <form id="form-login">
      <input type="text" id="username" placeholder="masukan username" required>

      <select id="peran" required>
        <option value="walikelas">wali kelas</option>
      </select>

      <input type="password" id="password" placeholder="masukan pw" required>

      <p id="pesan-error" class="error"></p>
      <button type="submit" class="tombol">login</button>
    </form>

    <p class="catatan">Contoh: username <b>walikelas</b> / pw <b>12345</b></p>
  </div>

  <script>
    // kalau sudah login, langsung ke beranda
    if (sessionStorage.getItem("login") === "walikelas") {
      window.location.href = "index.html";
    }

    document.getElementById("form-login").addEventListener("submit", function (e) {
      e.preventDefault();
      var user = document.getElementById("username").value.trim();
      var pass = document.getElementById("password").value;
      var peran = document.getElementById("peran").value;

      // username & password bebas (tidak berpatokan ke contoh), asal terisi
      if (peran === "walikelas" && user !== "" && pass !== "") {
        sessionStorage.setItem("login", "walikelas");
        window.location.href = "index.html";   // menuju beranda
      } else {
        document.getElementById("pesan-error").textContent = "Username atau password salah!";
      }
    });
  </script>
</body>
</html>
